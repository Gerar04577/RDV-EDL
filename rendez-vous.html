<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rendez-vous — état des lieux</title>
<meta name="theme-color" content="#F0997B">
<!-- rendez-vous.html — RDV EDL v2.7 — 22/09/2026

     L'ECRAN DU LOCATAIRE. C'est la seule page que voient les locataires ;
     elle s'ouvre par un lien de la forme :

         rendez-vous.html#nimy-6-sortie
         rendez-vous.html#nimy-6-entree

     MAKE RENSEIGNE, CETTE PAGE DECIDE. Le scenario rend quatre choses sans
     rien trancher : la ligne du locataire, son rendez-vous eventuel, le
     rendez-vous de l'AUTRE type pour le meme studio, et les creneaux libres.
     Les quatre regles s'appliquent ici :

       1. reconnaissance du locataire, en quatre cas
       2. un seul rendez-vous par etat des lieux
       3. l'entrant ne voit rien tant que le sortant n'a pas reserve
       4. six jours entre la sortie et l'entree d'un meme studio -->
<style>
  :root { --corail:#F0997B; --fonce:#4A1B0C; --fond:#FAF6F4; --bord:#E3D9D4;
          --vert:#1D9E75; --rouge:#C0392B; --gris:#7A7A7A; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--fond); color:#2B2B2B; padding:0 0 30px; }
  header { background:var(--corail); color:var(--fonce); padding:22px 16px 18px; }
  header h1 { margin:0; font-size:20px; }
  header .sous { font-size:13.5px; opacity:.85; margin-top:3px; }
  main { padding:16px 14px; max-width:560px; margin:0 auto; }
  .encart { background:#fff; border:1px solid var(--bord); border-radius:10px;
            padding:14px; margin:12px 0; font-size:14.5px; line-height:1.6; }
  .encart.ok { border-color:var(--vert); background:#EEF9F5; }
  .encart.ko { border-color:var(--rouge); background:#FDF3F2; color:var(--rouge); }
  .encart.attente { border-color:var(--corail); background:#FDF4F0; }
  label { display:block; font-size:13px; font-weight:600; color:var(--fonce);
          margin:12px 0 4px; }
  input[type=text], input[type=email] { width:100%; padding:13px;
          border:1px solid var(--bord); border-radius:9px; font-size:16px; }
  button { width:100%; padding:15px; margin:12px 0 0; border:0; border-radius:10px;
           background:var(--fonce); color:#fff; font-size:16px; font-weight:600;
           cursor:pointer; }
  button.clair { background:#fff; color:var(--fonce); border:1.5px solid var(--fonce); }
  button.danger { background:#fff; color:var(--rouge); border:1.5px solid var(--rouge); }
  button:disabled { background:var(--gris); cursor:not-allowed; }
  .creneau { display:block; width:100%; text-align:left; background:#fff;
             border:1px solid var(--bord); border-radius:10px; padding:14px;
             margin:8px 0; font-size:15.5px; cursor:pointer; color:#2B2B2B;
             font-weight:400; }
  .creneau:hover { border-color:var(--fonce); }
  .creneau b { display:block; font-size:16px; color:var(--fonce); }
  .creneau span { font-size:13px; color:var(--gris); }
  .jour { font-size:13px; font-weight:700; color:var(--fonce); text-transform:uppercase;
          margin:18px 0 2px; }
  .cache { display:none; }
</style>
</head>
<body>

<header>
  <h1 id="titre">Rendez-vous</h1>
  <div class="sous" id="sousTitre">état des lieux</div>
</header>

<main>
  <div id="etat" class="encart">Chargement…</div>

  <div id="identification" class="cache">
    <div class="encart">
      Pour accéder à votre rendez-vous, indiquez votre nom et l'adresse
      électronique que vous nous avez communiquée.
    </div>
    <label for="nom">Nom</label>
    <input type="text" id="nom" autocomplete="name" autocapitalize="words" enterkeyhint="next" placeholder="Votre nom">
    <label for="email">Adresse électronique</label>
    <input type="email" id="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="vous@exemple.be">
    <button onclick="identifier()">Continuer</button>
  </div>

  <div id="zone"></div>
</main>

<script src="bandeau-edl.js?v=1.2"></script>
<script src="signature-edl.js?v=1.0"></script>
<script>
var WEBHOOK = "https://hook.eu1.make.com/5tlvtxkyr8e2ake2knph6iv6nvrobvvf";
var JOURS_ECART = 6;   // entre la sortie et l'entrée d'un même studio

var contexte = null;   // { uniteId, type, libelle }
var donnees = null;    // la réponse de Make
var reconnu = null;    // { nom, email, correction }

function el(id){ return document.getElementById(id); }
/* Traduit la classe historique d'un message en nature de bandeau. Une
   operation en cours se reconnait a ses points de suspension. */
function natureDe(classe, html){
  var c = String(classe || "");
  if (/\bko\b|alerte/.test(c)) return "ko";
  if (/\bok\b/.test(c))        return "ok";
  if (/attente/.test(c))        return "attente";
  return /(…|\.\.\.)\s*$/.test(String(html || "").replace(/<[^>]+>/g, "").trim())
    ? "encours" : "info";
}
function bandeauDisponible(){ return typeof bandeauEDL === "function"; }

/* v2.2 — TOUT MESSAGE PASSE PAR LE BANDEAU.
   L'encart en haut de page etait trop discret : « c'est noté à 11:00 »
   passait inapercu. Le bandeau, fixe et en couleurs vives, prend le relais ;
   l'encart ne sert plus que si bandeau-edl.js n'a pas pu etre charge. */
function montrer(classe, texte){
  var n = el("etat");
  if (bandeauDisponible()){
    bandeauEDL(natureDe(classe, texte), texte);
    n.className = "cache"; n.innerHTML = "";
  } else {
    n.className = "encart " + classe; n.innerHTML = texte;
  }
}
function echapper(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; });
}

/* --- comparaison souple ------------------------------------------------
   Les noms saisis par vos locataires ne ressembleront pas exactement a ce
   que porte Gestion Loyers. Le fichier de septembre contient cinq couples
   — « Bérangère VERBRUGGEN & Lenny PATERNOSTRE » — et quatre noms saisis a
   l'envers — « HIFOUF Hayat ». Une comparaison stricte echouerait sur neuf
   locataires sur quarante-huit. */
function normaliser(s){
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // accents
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g, "")         // invisibles
    .toLowerCase().replace(/[^a-z0-9@. ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
function memeEmail(a, b){
  return !!normaliser(a) && normaliser(a) === normaliser(b);
}
/* Il suffit qu'un mot significatif du nom saisi figure dans le nom
   enregistre, ou l'inverse. « Hifouf » retrouve « HIFOUF Hayat », et
   « Paternostre » retrouve le couple. */
function memeNom(saisi, enregistre){
  var a = normaliser(saisi), b = normaliser(enregistre);
  if (!a || !b) return false;
  if (a === b) return true;
  var mots = a.split(" ").filter(function(m){ return m.length >= 3; });
  return mots.some(function(m){ return b.indexOf(m) !== -1; })
      || b.split(" ").filter(function(m){ return m.length >= 3; })
          .some(function(m){ return a.indexOf(m) !== -1; });
}

/* --- dates ------------------------------------------------------------- */
/* v2.6 — L'HEURE QUI COMPTE EST CELLE DE BRUXELLES.
   La page comparait les creneaux a l'heure du telephone. Un etudiant qui
   prend son rendez-vous de sortie depuis l'etranger n'est pas a l'heure
   belge : a Tokyo, un creneau belge dans deux heures etait masque ; a
   Montreal, un creneau deja passe restait propose. Les creneaux sont belges,
   l'heure de reference l'est aussi. */
function maintenantBruxelles(){
  try {
    var f = new Intl.DateTimeFormat("fr-CA", { timeZone: "Europe/Brussels",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false });
    var p = {};
    f.formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    var h = p.hour === "24" ? "00" : p.hour;
    return { date: p.year + "-" + p.month + "-" + p.day, heure: h + ":" + p.minute };
  } catch (e) {
    /* un navigateur sans fuseaux nommes : on retombe sur l'heure locale */
    var d = new Date();
    return { date: d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" +
                   ("0"+d.getDate()).slice(-2),
             heure: ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2) };
  }
}
function aujourdhui(){ return maintenantBruxelles().date; }
/* v2.4 — UNE LISTE VENUE DE MAKE N'EST PAS TOUJOURS UNE LISTE.
   Si le scenario renvoie un objet ou un texte a la place — un agregateur
   regle autrement, une reponse modifiee a la main — « .filter » plantait, et
   l'ecran restait fige sur sa roue, sans croix ni explication. On accepte
   une liste, on enveloppe un objet isole, et on ignore le reste. */
function enListe(x){
  if (Array.isArray(x)) return x;
  if (x && typeof x === "object") return [x];
  return [];
}
function dateDeCle(cle){ return String(cle || "").slice(0, 10); }
function ecartJours(a, b){
  return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);
}
function enFrancais(iso){
  var d = new Date(iso + "T12:00:00");
  var j = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"][d.getDay()];
  var m = ["janvier","février","mars","avril","mai","juin","juillet","août",
           "septembre","octobre","novembre","décembre"][d.getMonth()];
  return j + " " + d.getDate() + " " + m;
}

/* --- le lien ----------------------------------------------------------- */
function lireLien(){
  var h = decodeURIComponent(String(location.hash || "").replace(/^#/, "")).trim();
  var m = h.match(/^(.+)-(sortie|entree)$/);
  if (!m) return null;
  return { uniteId: m[1],
           type: m[2] === "sortie" ? "EDLS" : "EDLE",
           libelle: m[2] === "sortie" ? "de sortie" : "d'entrée" };
}

/* --- les regles, appliquees a la liste des creneaux ---------------------
   Rend { liste, message } : le message explique pourquoi la liste est vide,
   plutot que de laisser le locataire devant un ecran muet. */
function creneauxOuverts(d, ctx){
  /* v1.1 — UN CRENEAU EST PRIS PARCE QU'UN RENDEZ-VOUS PORTE SA CLE.
     Le scenario ne tient plus de champ « etat » : il renvoie tous les
     creneaux du type demande, et la liste des cles deja reservees. La
     soustraction se fait ici. Un etat a maintenir dans deux magasins finit
     toujours par diverger ; une cle presente ou absente, jamais. */
  /* v1.3 — LA LIGNE FANTOME DE L'AGREGATEUR.
     Quand une recherche ne trouve rien, json:AggregateToJSON ne rend pas un
     tableau vide mais UNE entree aux champs nuls :
         "creneaux":[{"cle":null,"date":null,"duree":null,"heure":null}]
     Verifie le 20/09 sur le compte : type EDLE, aucun creneau ouvert.
     Le garde-fou n'existait que sur « pris ». Sans lui sur « creneaux », la
     page aurait propose un creneau vide, et le clic aurait envoye une cle
     nulle. On ecarte donc les entrees sans cle DES DEUX COTES. */
  var pris = {};
  enListe(d && d.pris).forEach(function(p){ if (p && p.cle) pris[p.cle] = true; });

  var tous = enListe(d && d.creneaux)
    .filter(function(c){ return c && c.cle && c.date && c.heure; })
    .filter(function(c){ return !pris[c.cle]; });
  /* v2.5 — les DATES passees etaient ecartees, pas les HEURES : a 10 h, le
     creneau de 8 h du jour meme restait propose, et reservable. */
  var heureCourante = maintenantBruxelles().heure;
  var aVenir = tous.filter(function(c){
    var d = dateDeCle(c.cle);
    if (d > aujourdhui()) return true;
    if (d < aujourdhui()) return false;
    return String(c.heure || "") > heureCourante;
  });
  if (!aVenir.length){
    return { liste: [], message: tous.length
      ? "Toutes les dates proposées sont passées. Prenez contact avec nous."
      : "Aucun créneau n'est ouvert pour le moment. Vous recevrez un message dès qu'il y en aura." };
  }

  var cleAutre = d.rdvAutre && d.rdvAutre.creneau;
  var dateAutre = (cleAutre && String(cleAutre).length >= 10)
                  ? dateDeCle(cleAutre) : "";

  if (ctx.type === "EDLE"){
    /* L'entrant attend le sortant : sans etat des lieux de sortie fixe, on
       ne peut pas savoir a partir de quand le logement sera disponible. */
    if (!dateAutre){
      return { liste: [], message:
        "L'état des lieux de sortie du locataire précédent n'est pas encore " +
        "fixé. Nous vous préviendrons dès que vous pourrez choisir votre " +
        "rendez-vous." };
    }
    var ok = aVenir.filter(function(c){
      return ecartJours(dateAutre, dateDeCle(c.cle)) >= JOURS_ECART; });
    return { liste: ok, message: ok.length ? "" :
      "Aucune date ne convient encore : un délai de " + JOURS_ECART +
      " jours est nécessaire après le départ du locataire précédent, prévu le " +
      enFrancais(dateAutre) + ". Prenez contact avec nous." };
  }

  /* Le sortant : si une entree est deja fixee, il doit partir assez tot. */
  if (dateAutre){
    var ok2 = aVenir.filter(function(c){
      return ecartJours(dateDeCle(c.cle), dateAutre) >= JOURS_ECART; });
    return { liste: ok2, message: ok2.length ? "" :
      "Aucune date ne convient : l'entrée du locataire suivant est fixée au " +
      enFrancais(dateAutre) + ", et un délai de " + JOURS_ECART +
      " jours est nécessaire. Prenez contact avec nous." };
  }
  return { liste: aVenir, message: "" };
}

/* --- appels a Make ----------------------------------------------------- */
/* v2.5 — LES MESSAGES DU NAVIGATEUR SONT EN ANGLAIS.
   Sans connexion, Safari repond « Load failed », Chrome « Failed to fetch »,
   Firefox « NetworkError… » : la page les recopiait tels quels, et un
   locataire au reseau faible lisait de l'anglais sans comprendre. On traduit
   les causes connues ; le reste est rendu tel quel, faute de mieux. */
function expliquerErreur(e){
  if (e && e.name === "AbortError") return "pas de réponse après 30 secondes";
  var m = String((e && e.message) || e || "");
  if (/load failed|failed to fetch|networkerror|network request failed|internet connection appears to be offline/i.test(m))
    return "pas de connexion Internet — vérifiez votre réseau";
  return m;
}
async function appeler(corps){
  var minuterie = new AbortController();
  var echeance = setTimeout(function(){ minuterie.abort(); }, 30000);
  try {
    var res = await fetch(WEBHOOK, { method:"POST", signal: minuterie.signal,
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(corps) });
    clearTimeout(echeance);
    var texte = await res.text();
    if (!res.ok) throw new Error("le serveur a répondu " + res.status +
      (texte ? " — " + texte.slice(0, 120) : ""));
    try { return JSON.parse(texte); }
    catch (e){
      /* v1.6 — « réponse illisible » NE DISAIT PAS CE QUI AVAIT ETE RECU.
         Make repond « Accepted », en texte brut, quand le scenario n'est pas
         actif : la requete est mise en file d'attente et aucun module de
         reponse n'est atteint. Le message laissait croire a un defaut de la
         page, alors qu'il suffisait d'activer le scenario. */
      var brut = String(texte || "").trim();
      /* v1.7 — « Accepted » NE SIGNIFIE PAS SEULEMENT « SCENARIO ETEINT ».
         Make repond aussi « Accepted » quand la branche s'arrete avant son
         module de reponse — un filtre qui bloque suffit. Le 20/09, le
         rendez-vous etait inscrit et la page annoncait un echec. Le message
         ne doit donc accuser personne : il dit ce qui est sur, et invite a
         verifier plutot qu'a refaire. */
      if (/^accepted$/i.test(brut)) {
        throw new Error("Make a accepté la demande sans répondre. " +
          "L'opération a peut-être abouti : rechargez la page avant de " +
          "recommencer");
      }
      throw new Error("réponse illisible" +
        (brut ? " : « " + brut.slice(0, 120) + " »" : " (réponse vide)"));
    }
  } catch (e){
    clearTimeout(echeance);
    throw new Error(expliquerErreur(e));
  }
}

/* --- identification ---------------------------------------------------- */
async function identifier(){
  var nom = el("nom").value.trim(), email = el("email").value.trim();
  if (!nom || !email){
    montrer("ko", "Indiquez votre nom et votre adresse électronique."); return;
  }
  montrer("", "Vérification…");
  try {
    donnees = await appeler({ action:"creneaux", uniteId: contexte.uniteId,
                              type: contexte.type, nom: nom, email: email });
  } catch (e){
    montrer("ko", "La vérification a échoué — " + echapper(e.message) +
      ". Réessayez dans un instant."); return;
  }

  var l = donnees.locataire || {};
  var nomOk = memeNom(nom, l.nom), emailOk = memeEmail(email, l.email)
           || memeEmail(email, l.emailGarant);

  if (!nomOk && !emailOk){
    montrer("ko", "Ces informations ne correspondent pas à ce logement. " +
      "Vérifiez l'orthographe, ou prenez contact avec nous.");
    return;
  }

  /* Un seul des deux concorde : on accepte, on retient ce que le locataire
     vient de saisir, et on note la correction a reporter. */
  reconnu = {
    nom: nomOk ? (l.nom || nom) : nom,
    email: emailOk ? (l.email || email) : email,
    correction: (nomOk && emailOk) ? null : (nomOk ? "email" : "nom")
  };
  el("identification").className = "cache";
  afficher();
}

/* --- affichage --------------------------------------------------------- */
function afficher(){
  var l = donnees.locataire || {};
  var studio = l.studio || contexte.uniteId;
  el("sousTitre").textContent = "état des lieux " + contexte.libelle +
    " — " + studio;

  /* meme prudence ici : rdvExistant et rdvAutre portent une chaine vide
     quand rien n'a ete trouve, jamais null — mais une valeur inattendue ne
     doit pas faire passer la page en mode « rendez-vous pris ». */
  var deja = donnees.rdvExistant && donnees.rdvExistant.creneau
             && String(donnees.rdvExistant.creneau).length >= 10
             ? donnees.rdvExistant.creneau : "";
  if (deja){
    var d = dateDeCle(deja), h = String(deja).slice(11, 16).replace("h", ":");
    montrer("ok", "Votre rendez-vous est fixé au <b>" + enFrancais(d) +
      " à " + h + "</b>.");
    el("zone").innerHTML =
      '<button class="danger" onclick="annuler()">Annuler ce rendez-vous</button>' +
      '<div class="encart">Après annulation, vous pourrez choisir une autre date.</div>';
    return;
  }

  var r = creneauxOuverts(donnees, contexte);
  if (!r.liste.length){
    montrer("attente", r.message); el("zone").innerHTML = ""; return;
  }

  montrer("", "Choisissez la date et l'heure qui vous conviennent. " +
    "Les créneaux se réservent au fur et à mesure.");

  var parJour = {};
  r.liste.forEach(function(c){
    (parJour[dateDeCle(c.cle)] = parJour[dateDeCle(c.cle)] || []).push(c); });

  el("zone").innerHTML = Object.keys(parJour).sort().map(function(j){
    return '<div class="jour">' + enFrancais(j) + "</div>" +
      parJour[j].sort(function(a,b){ return a.heure < b.heure ? -1 : 1; })
        .map(function(c){
          /* v1.5 — echapper() ne traite pas l'apostrophe, qui refermerait
             l'attribut onclick. Les cles n'en contiennent pas aujourd'hui,
             mais la page ne doit pas dependre de cela. */
          return '<button class="creneau" onclick="reserver(\'' +
            echapper(c.cle).replace(/'/g, "&#39;") + '\')"><b>' + echapper(c.heure) + "</b><span>durée " +
            (c.duree >= 120 ? "2 h 30" : "1 h 30") + "</span></button>";
        }).join("");
  }).join("");
}

/* v1.4 — NE PLUS FAIRE RESSAISIR L'IDENTITE.

   Apres une reservation, la page annoncait « c'est noté » et n'affichait
   plus rien : il fallait se reidentifier pour constater que le rendez-vous
   existait. Apres une annulation, meme chose en sens inverse — retaper nom
   et adresse pour choisir une autre date.

   Or la page connait deja le locataire : il vient d'etre reconnu. Elle
   redemande donc les donnees a Make et se redessine, au lieu de tout
   recommencer. */
async function rafraichirEcran(message) {
  try {
    donnees = await appeler({ action: "creneaux", uniteId: contexte.uniteId,
      type: contexte.type, nom: reconnu.nom, email: reconnu.email });
  } catch (e) {
    montrer("ko", "L'écran n'a pas pu être actualisé — " + echapper(e.message) +
      ". Rechargez la page pour voir où vous en êtes.");
    el("zone").innerHTML =
      '<button class="clair" onclick="location.reload()">Recharger</button>';
    return;
  }
  afficher();
  if (message) montrer("ok", message);
}

/* v1.8 — LE COURRIEL DE CONFIRMATION EST COMPOSE ICI.
   Schema repris du scenario d'etat des lieux de Gerard : la page ecrit
   l'objet et le corps, Make les relaie tels quels. Aucune fonction de date
   dans Make, donc aucune date en anglais : on ecrit « jeudi 1er octobre
   2026 », la ou formatDate aurait produit « Thursday ».
   Ton impersonnel : « Madame, Monsieur », salutations distinguees, aucun
   prenom. La signature selon l'immeuble reste a trancher. */
function dateEnLettres(iso){
  var d = new Date(iso + "T12:00:00");
  var j = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"][d.getDay()];
  var m = ["janvier","février","mars","avril","mai","juin","juillet","août",
           "septembre","octobre","novembre","décembre"][d.getMonth()];
  var n = d.getDate();
  return j + " " + (n === 1 ? "1er" : n) + " " + m + " " + d.getFullYear();
}

/* v2.1 — UN FICHIER DE SIGNATURE ABSENT NE DOIT RIEN BLOQUER.
   Si signature-edl.js manque — oubli au chargement, fichier resté en cache
   — signatureEDL n'existe pas, la composition du courriel plante, et la
   reservation n'etait jamais envoyee. Un fichier qui ne sert qu'a signer
   bloquait la fonction principale. On signe alors par defaut, et le
   rendez-vous part. */
function signer(uniteId){
  try {
    if (typeof signatureEDL === "function") return signatureEDL(uniteId);
  } catch (e) { /* on retombe sur la signature par defaut */ }
  return "Jean-Marc Gérard";
}

function composerConfirmation(c, studio){
  var nature = contexte.type === "EDLS" ? "de sortie" : "d'entrée";
  /* v1.9 — l'adresse de la page, SANS ses parametres.
     location.href garde tout ce qui precede le diese, y compris les
     parametres de suivi que les messageries ajoutent aux liens cliques
     (« ?fbclid=… », « ?utm_source=… »). Le lien du courriel les aurait
     recopies. L'origine et le chemin suffisent. */
  var lien = location.origin + location.pathname + "#" + contexte.uniteId + "-" +
             (contexte.type === "EDLS" ? "sortie" : "entree");
  return {
    objet: "Confirmation — état des lieux " + nature + " — " + studio,
    corps: "Madame, Monsieur,\n\n" +
      "Nous vous confirmons le rendez-vous pour l'état des lieux " + nature +
      " de votre logement " + studio + ", le " + dateEnLettres(c.date) +
      " à " + c.heure + ".\n\n" +
      "Pour modifier ou annuler ce rendez-vous, utilisez le lien suivant :\n\n" +
      lien + "\n\n" +
      /* v2.0 — l'avertissement demande par Gerard : un locataire qui annule
         doit savoir qu'il risque de ne plus trouver de place s'il tarde. */
      "Nous attirons votre attention sur le fait que les créneaux se " +
      "réservent habituellement très vite. En cas d'annulation, nous vous " +
      "invitons à choisir sans tarder une nouvelle date.\n\n" +
      "Veuillez agréer, Madame, Monsieur, l'expression de nos salutations " +
      "distinguées.\n\n" +
      signer(contexte.uniteId)
  };
}

/* --- reservation ------------------------------------------------------- */
var enCours = false;   // v1.2 — voir ci-dessous

async function reserver(cle){
  /* v1.2 — UN DOUBLE CLIC PARTAIT DEUX FOIS.
     Sur un telephone, un appui un peu long declenche volontiers deux
     evenements. La premiere requete prenait le creneau, la seconde se
     heurtait a la cle deja prise — et le locataire lisait « ce creneau
     vient d'etre reserve » alors que c'etait lui qui venait de le prendre. */
  if (enCours) return;
  var c = enListe(donnees.creneaux).filter(function(x){ return x && x.cle === cle; })[0];
  if (!c) return;
  if (!confirm("Confirmer le rendez-vous du " + enFrancais(dateDeCle(cle)) +
      " à " + c.heure + " ?")) return;

  enCours = true;
  el("zone").innerHTML = "";
  montrer("", "Enregistrement…");
  var l = donnees.locataire || {};
  var courriel = composerConfirmation(c, l.studio || contexte.uniteId);
  try {
    /* v1.2 — la correction relevee a l'identification (nom ou courriel qui
       ne concordait pas) etait calculee puis oubliee. Elle part desormais
       avec la reservation ; le scenario l'inscrira dans Corrections EDL. */
    var rep = await appeler({ action:"reserver", cle: cle, date: c.date,
      heure: c.heure, duree: c.duree, type: contexte.type,
      uniteId: contexte.uniteId, immeuble: l.immeuble || "",
      studio: l.studio || "", nom: reconnu.nom, email: reconnu.email,
      correction: reconnu.correction || "",
      ancienneValeur: reconnu.correction === "email" ? (l.email || "")
                    : reconnu.correction === "nom" ? (l.nom || "") : "",
      objet_courriel: courriel.objet,
      corps_courriel: courriel.corps });
  } catch (e){
    enCours = false;
    afficher();
    montrer("ko", "L'enregistrement a échoué — " + echapper(e.message) +
      ". Votre rendez-vous n'est pas pris ; réessayez.");
    return;
  }
  /* v1.5 — le verrou etait rendu AVANT le rafraichissement : pendant cette
     seconde requete, un clic restait possible. On le rend a la toute fin. */
  if (rep && rep.ok){
    await rafraichirEcran("Rendez-vous réservé : <b>" + enFrancais(dateDeCle(cle)) +
      " à " + c.heure + "</b>.<br>Une confirmation vous est envoyée par courriel.");
  } else {
    /* le creneau a ete pris entre l'affichage et le clic : on redessine la
       liste sans lui, plutot que de laisser le locataire devant un bouton. */
    await rafraichirEcran();
    montrer("ko", (rep && rep.message) ||
      "Ce créneau vient d'être réservé. Choisissez-en un autre.");
  }
  enCours = false;
}

/* --- annulation -------------------------------------------------------- */
async function annuler(){
  /* v1.5 — L'ANNULATION N'AVAIT AUCUN VERROU.
     Un double appui envoyait deux annulations : la premiere supprimait le
     rendez-vous, la seconde ne trouvait plus rien et affichait « aucun
     rendez-vous n'a été trouvé à annuler » — un message alarmant alors que
     tout s'etait bien passe. Meme remede que pour la reservation, et le
     bouton disparait pendant l'operation. */
  if (enCours) return;
  if (!confirm("Annuler votre rendez-vous ?")) return;
  enCours = true;
  el("zone").innerHTML = "";
  montrer("", "Annulation…");
  try {
    var rep = await appeler({ action:"annuler", uniteId: contexte.uniteId,
      type: contexte.type, nom: reconnu.nom, email: reconnu.email });
  } catch (e){
    /* v1.5 — l'ordre comptait : afficher() redessine ET reecrit le message.
       Appele apres montrer(), il effacait l'echec et annoncait « votre
       rendez-vous est fixé » — exactement le contraire de ce qui venait de
       se passer. On redessine d'abord, on parle ensuite. */
    enCours = false;
    afficher();
    montrer("ko", "L'annulation a échoué — " + echapper(e.message) +
      ". Votre rendez-vous est maintenu.");
    return;
  }
  /* v1.2 — le scenario rend « annule » vide quand il n'a rien trouve : sans
     ce controle, la page annoncait une annulation qui n'avait pas eu lieu. */
  /* v1.5 — LE VERROU N'ETAIT RENDU SUR AUCUN CHEMIN DE REUSSITE.
     Une annulation reussie laissait enCours a true : plus aucune reservation
     n'etait ensuite possible, et le locataire cliquait dans le vide sans le
     moindre message. Le verrou est rendu ici, quel que soit le resultat. */
  enCours = false;
  if (rep && rep.ok && rep.annule){
    await rafraichirEcran("Votre rendez-vous est annulé. " +
      "Choisissez une autre date ci-dessous.");
  } else if (rep && rep.ok){
    afficher();
    montrer("ko", "Aucun rendez-vous n'a été trouvé à annuler. " +
      "Rechargez la page, ou prenez contact avec nous.");
  } else {
    afficher();
    montrer("ko", (rep && rep.message) || "L'annulation n'a pas abouti.");
  }
}

/* v2.7 — LE CLAVIER DU TELEPHONE.
   La touche « Aller » ne faisait rien : le locataire devait fermer le
   clavier et chercher le bouton. Desormais, « Suivant » dans le nom passe au
   courriel, et « Aller » dans le courriel lance la verification.
   Le remplissage automatique etait coupe sur ces deux champs. Pour un
   locataire, c'est l'inverse qu'il faut : son telephone connait son adresse,
   la lui proposer evite les fautes de frappe — premiere cause de refus a
   l'identification. */
el("nom").addEventListener("keydown", function(ev){
  if (ev.key === "Enter"){ ev.preventDefault(); el("email").focus(); }
});
el("email").addEventListener("keydown", function(ev){
  if (ev.key === "Enter"){ ev.preventDefault(); el("email").blur(); identifier(); }
});

/* --- ouverture --------------------------------------------------------- */
(function(){
  contexte = lireLien();
  if (!contexte){
    montrer("ko", "Ce lien est incomplet. Utilisez celui du courriel " +
      "que nous vous avons adressé.");
    return;
  }
  el("titre").textContent = "État des lieux " + contexte.libelle;
  el("sousTitre").textContent = contexte.uniteId;
  montrer("", "Indiquez votre nom et votre adresse électronique pour continuer.");
  el("identification").className = "";
})();
</script>
